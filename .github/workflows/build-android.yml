name: Build SKULL STUDIO AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Package APK and complete source ZIP
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Skull-Studio-AI-debug.apk
          git archive --format=zip --output=release/Skull-Studio-AI-source.zip HEAD

      - name: Upload APK and source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: skull-studio-ai-upgrade
          path: release/*
          if-no-files-found: error
          retention-days: 14
